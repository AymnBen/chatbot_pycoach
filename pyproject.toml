[project]
name = "pycoach-tp"
version = "1.0.0"
description = "TP chatbot specialise - notebook, FastAPI et React"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openai>=1.60,<3", "python-dotenv>=1,<2", "pandas>=2.2,<3", "ipykernel>=6,<8", "jupyter>=1,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "nbformat>=5,<6"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
